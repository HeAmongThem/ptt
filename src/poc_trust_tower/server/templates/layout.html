<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            {% if title %} POC Trust Tower - {{title}} {% else %} POC Trust
            Tower {% endif %}
        </title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <div class="d-flex flex-column h-100 w-100 p-4">
            <div class="row-header w-100 border">
                <header class="d-flex justify-content-center w-100 border">
                    {% block header %} {% endblock header %}
                </header>
            </div>
            <div class="row-content flex-grow-1 w-100 vh-100">
                <main class="d-flex justify-content-center h-100 w-100">
                    {% block content %} {% endblock content %}
                </main>
            </div>
        </div>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
