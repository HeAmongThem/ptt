{% extends "layout.html" %}

{% block header %}
<h1 class="h3 my-3">Connexion</h1>
{% endblock header %}

{% block content %}
<div class="w-100 align-self-center" style="max-width: 420px">
    <div class="card">
        <div class="card-body">
            {% if error %}
            <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
            {% endif %}
            <form class="d-flex flex-column gap-3" method="post" action="/login{% if next %}?next={{ next|urlencode }}{% endif %}">
                <div>
                    <label for="f-email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="f-email" name="email"
                           value="{{ email }}" placeholder="email@example.com" required autofocus autocomplete="username">
                </div>
                <div>
                    <label for="f-password" class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" id="f-password" name="password"
                           placeholder="Mot de passe" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
