{% extends "layout.html" %} {%block content%}
<div class="h-75 w-75 align-self-center p-2">
    <h2>Connexion</h2>
    <form class="d-flex flex-column gap-3 h-100" method="post" action="/login">
        <div class="form-email">
            <label for="staticEmail2">Email</label>
            <input
                type="text"
                class="form-control"
                id="staticEmail2"
                placeholder="email@example.com"
            />
        </div>
        <div class="form-password">
            <label for="inputPassword2">Password</label>
            <input
                type="password"
                class="form-control"
                id="inputPassword2"
                placeholder="Password"
            />
        </div>
        <div class="form-submit align-self-center">
            <button type="submit" class="btn btn-primary mb-3">
                Confirm identity
            </button>
        </div>
    </form>
</div>
{%endblock content%}
