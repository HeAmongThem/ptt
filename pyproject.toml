[project]
name = "poc-trust-tower"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "olivier", email = "HeAmongThem@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pycontext>=1.0",
    "pywebview>=6.2.1",
]

[project.scripts]
poc-trust-tower = "poc_trust_tower.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
